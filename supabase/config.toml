project_id = "treff"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Catches every outbound e-mail locally instead of sending it.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.plan-photos]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

# Selfies are private: only the reviewer service role ever reads them, and they
# are deleted once verification completes.
[storage.buckets.verification]
public = false
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "treff://"
additional_redirect_urls = ["treff://", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so sign-up does not block on a confirmation link.
enable_confirmations = false
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[realtime]
enabled = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
